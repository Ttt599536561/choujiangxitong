<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E9A568"/>
    </linearGradient>
  </defs>
  <!-- 机身 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#161D2B"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- 齿轮齿 -->
  <g fill="url(#gold)">
    <rect x="28.5" y="9" width="7" height="11" rx="2"/>
    <rect x="28.5" y="9" width="7" height="11" rx="2" transform="rotate(45 32 32)"/>
    <rect x="28.5" y="9" width="7" height="11" rx="2" transform="rotate(90 32 32)"/>
    <rect x="28.5" y="9" width="7" height="11" rx="2" transform="rotate(135 32 32)"/>
    <rect x="28.5" y="9" width="7" height="11" rx="2" transform="rotate(180 32 32)"/>
    <rect x="28.5" y="9" width="7" height="11" rx="2" transform="rotate(225 32 32)"/>
    <rect x="28.5" y="9" width="7" height="11" rx="2" transform="rotate(270 32 32)"/>
    <rect x="28.5" y="9" width="7" height="11" rx="2" transform="rotate(315 32 32)"/>
  </g>
  <!-- 齿轮盘 -->
  <circle cx="32" cy="32" r="15" fill="url(#gold)"/>
  <circle cx="32" cy="32" r="8.5" fill="#161D2B"/>
  <circle cx="32" cy="32" r="3.2" fill="url(#gold)" opacity="0.85"/>
</svg>
