<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E9A568"/>
    </linearGradient>
  </defs>
  <!-- 机身 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#161D2B"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- 三列滚轮 -->
  <rect x="12" y="17" width="12" height="30" rx="3.5" fill="#0F131C"/>
  <rect x="26" y="17" width="12" height="30" rx="3.5" fill="#0F131C"/>
  <rect x="40" y="17" width="12" height="30" rx="3.5" fill="#0F131C"/>
  <!-- 中奖线高亮 -->
  <rect x="12" y="28" width="40" height="8" rx="2" fill="url(#gold)" opacity="0.9"/>
  <!-- 滚轮上的符号 -->
  <circle cx="18" cy="22.5" r="2.4" fill="url(#gold)" opacity="0.55"/>
  <circle cx="32" cy="22.5" r="2.4" fill="url(#gold)" opacity="0.55"/>
  <circle cx="46" cy="22.5" r="2.4" fill="url(#gold)" opacity="0.55"/>
  <circle cx="18" cy="41.5" r="2.4" fill="url(#gold)" opacity="0.55"/>
  <circle cx="32" cy="41.5" r="2.4" fill="url(#gold)" opacity="0.55"/>
  <circle cx="46" cy="41.5" r="2.4" fill="url(#gold)" opacity="0.55"/>
  <!-- 拉杆 -->
  <rect x="55" y="26" width="3" height="14" rx="1.5" fill="url(#gold)"/>
  <circle cx="56.5" cy="23" r="3.5" fill="#DC2626"/>
</svg>
